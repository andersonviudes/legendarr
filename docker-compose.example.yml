# Production docker-compose example for legendarr — see docs/getting-started/installation.md.
# Copy this file to docker-compose.yml, adjust the paths/env vars for your setup, then:
#   docker compose up -d

services:
  legendarr:
    image: ghcr.io/andersonviudes/legendarr:latest
    environment:
      - LEGENDARR_RADARR_URL=http://radarr:7878
      - LEGENDARR_RADARR_API_KEY=your-radarr-api-key
      - LEGENDARR_SONARR_URL=http://sonarr:8989
      - LEGENDARR_SONARR_API_KEY=your-sonarr-api-key
      - PUID=1000
      - PGID=1000
    volumes:
      - ./data:/config
      - /path/to/your/library:/media
    ports:
      - "8000:8000"
    restart: unless-stopped
