# Local dev stack for testing legendarr against a real Sonarr instance.
#
# Not part of the shipped product (see docs/getting-started/installation.md for the
# production `docker run` command) — this is a throwaway sandbox for manually exercising
# the media-library sync, webhooks, and history poll against real Sonarr behavior.
#
# Usage:
#   1. mkdir -p dev/media/tv && drop a real episode file in there (e.g. a
#      Show.Name.S01E01.mkv, named the way Sonarr expects so it can match it).
#   2. docker compose -f docker-compose.dev.yml up --build
#   3. Open Sonarr at http://localhost:8989, finish setup, grab its API key from
#      Settings → General, add the series so it recognizes dev/media/tv, then
#      trigger a manual import / disk scan for the file you dropped in.
#   4. Open legendarr at http://localhost:8000 → Settings → Servers → add a Sonarr
#      connection: host "sonarr", port 8989, the API key from step 3. Sonarr and
#      legendarr mount the same host folder at different container paths on purpose
#      (/tv vs /media/tv) — set remote path prefix "/tv" and local path prefix
#      "/media/tv" on the connection to exercise path mapping too.
#   5. Watch the media library sync in, then use Sonarr's webhook (Settings →
#      Connect → legendarr, target http://legendarr:8000/api/webhooks/arr/<id>) or
#      wait for the scheduled sync/scan/history-poll jobs to pick the file up.
#
# Plex/Jellyfin (optional, for exercising media_servers/notify_media_servers.py):
#   - Both mount dev/media/tv at the exact same /media/tv path legendarr uses, since
#     both providers match/resolve library items by that path — Plex by prefix-matching
#     a section's root folder, Jellyfin by looking the path up directly.
#   - Disabled by default (profile "media-servers") so a plain `docker compose up` doesn't
#     pull them in — opt in with `docker compose -f docker-compose.dev.yml --profile
#     media-servers up --build`.
#   - Plex: open http://localhost:32400/web, sign in with a Plex account to claim the
#     server, add a library pointing at /media/tv, then grab a token from Settings →
#     (a synced device's) "X-Plex-Token" — see https://support.plex.tv for the current
#     way to find it. In legendarr Settings → Media Servers, use base_url
#     "http://plex:32400".
#   - Jellyfin: open http://localhost:8096, finish the setup wizard, add a library
#     pointing at /media/tv, then create an API key under Dashboard → Advanced → API
#     Keys. In legendarr Settings → Media Servers, use base_url "http://jellyfin:8096".
#
# `dev/` is gitignored — it holds Sonarr's config and whatever media you drop in.

services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - ./dev/sonarr-config:/config
      - ./dev/media/tv:/tv
    ports:
      - "8989:8989"
    restart: unless-stopped

  plex:
    image: lscr.io/linuxserver/plex:latest
    profiles:
      - media-servers
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - VERSION=docker
    volumes:
      - ./dev/plex-config:/config
      - ./dev/media/tv:/media/tv
    ports:
      - "32400:32400"
    restart: unless-stopped

  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    profiles:
      - media-servers
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - ./dev/jellyfin-config:/config
      - ./dev/media/tv:/media/tv
    ports:
      - "8096:8096"
    restart: unless-stopped

  legendarr:
    build: .
    environment:
      - PUID=1000
      - PGID=1000
    volumes:
      - ./dev/legendarr-config:/config
      - ./dev/media/tv:/media/tv
    ports:
      - "8000:8000"
    depends_on:
      - sonarr
    restart: unless-stopped
