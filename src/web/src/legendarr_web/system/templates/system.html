{% extends "base.html" %}
{% block title %}legendarr · {{ t("nav.system") }}{% endblock %}
{% block content %}
<h1>{{ icon("server") }} {{ t("nav.system") }}</h1>

<section>
  <div class="log-toolbar">
    <h2>{{ icon("scroll-text") }} {{ t("nav.system.logs") }}</h2>
    <label for="log-level-filter">
      {{ t("system.logs.min_level_label") }}
      <select id="log-level-filter" name="level">
        <option value="">{{ t("common.all") }}</option>
        <option value="DEBUG">{{ t("system.logs.level_debug") }}</option>
        <option value="INFO">{{ t("system.logs.level_info") }}</option>
        <option value="WARNING">{{ t("system.logs.level_warning") }}</option>
        <option value="ERROR">{{ t("system.logs.level_error") }}</option>
      </select>
    </label>
  </div>
  <div
    id="log-lines"
    class="log-lines"
    hx-get="/system/logs"
    hx-trigger="every 3s, change from:#log-level-filter"
    hx-include="#log-level-filter"
    hx-swap="innerHTML"
  >
    {% include "_log_lines.html" %}
  </div>
</section>
{% endblock %}
