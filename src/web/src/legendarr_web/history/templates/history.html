{% extends "base.html" %}
{% from "macros.html" import empty_state %}
{% block title %}legendarr · {{ t("nav.history") }}{% endblock %}
{% block content %}
<hgroup>
  <h1>{{ icon("history") }} {{ t("nav.history") }}</h1>
  <p>{{ t("history.subtitle") }}</p>
</hgroup>

<div class="history-search">
  <input
    type="search"
    id="history-search-input"
    name="q"
    class="history-search-input"
    placeholder="{{ t('common.search') }}"
    value="{{ q }}"
    autocomplete="off"
    hx-get="/history/"
    hx-trigger="input changed delay:300ms, search"
    hx-include="#history-category-filter"
    hx-target="#history-results"
    hx-swap="innerHTML"
  >
  <label for="history-category-filter" class="history-category-filter-label">
    {{ t("history.table.category") }}
    <select
      id="history-category-filter"
      name="category"
      hx-get="/history/"
      hx-trigger="change"
      hx-include="#history-search-input"
      hx-target="#history-results"
      hx-swap="innerHTML"
    >
      <option value="" {% if not category %}selected{% endif %}>{{ t("common.all") }}</option>
      <option value="translation" {% if category == "translation" %}selected{% endif %}>
        {{ t("history.category.translation") }}
      </option>
      <option value="acquisition" {% if category == "acquisition" %}selected{% endif %}>
        {{ t("history.category.acquisition") }}
      </option>
      <option value="upgrade" {% if category == "upgrade" %}selected{% endif %}>
        {{ t("history.category.upgrade") }}
      </option>
    </select>
  </label>
</div>

<div id="history-results">
  {% include "_history_results.html" %}
</div>
{% endblock %}
