<!doctype html>
<html lang="{{ request.state.locale }}" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>legendarr · {{ t("auth.login.title") }}</title>
    <script>
      // Applied before the stylesheets load so a stored preference never flashes the
      // wrong theme on first paint — same snippet as base.html.
      (function () {
        var stored = localStorage.getItem("legendarr-theme");
        if (stored) document.documentElement.setAttribute("data-theme", stored);
      })();
    </script>
    <link rel="stylesheet" href="/static/vendor/pico.min.css" />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body class="login-page">
    <main class="login-shell">
      <article class="login-card">
        <div class="login-brand">
          <span class="app-brand-mark">{{ icon("lock") }}</span>
          <span>legendarr</span>
        </div>
        {% if error %}
        <p class="login-error">{{ error }}</p>
        {% endif %}
        <form method="post" action="/login">
          <input type="hidden" name="next" value="{{ next }}" />
          <label for="username">{{ t("common.username") }}</label>
          <input type="text" id="username" name="username" required autofocus />
          <label for="password">{{ t("common.password") }}</label>
          <input type="password" id="password" name="password" required />
          <button type="submit">{{ icon("log-in") }}<span>{{ t("auth.login.submit") }}</span></button>
        </form>
      </article>
    </main>
  </body>
</html>
