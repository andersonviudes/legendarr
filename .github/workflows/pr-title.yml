name: PR Title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            chore
            ci
            refactor
            test
            style
            perf
            build
            revert
          requireScope: false
          subjectPattern: ^[a-z].*[^.]$
          subjectPatternError: >-
            summary must start lowercase and not end with a period, per
            .claudin/rules/commit-message-convention.md
