name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version part to bump
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write
  actions: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/reusable-test.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Bump version
        run: scripts/bump_version.sh ${{ inputs.bump }}

      - name: Read new version
        id: version
        run: echo "value=$(uv version --short)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for smoke test (amd64 only, loaded locally)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: legendarr:smoke-test
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          container_id=$(docker run -d -p 8000:8000 legendarr:smoke-test)
          trap 'docker logs "$container_id"; docker rm -f "$container_id" >/dev/null' EXIT
          for i in $(seq 1 30); do
            status=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/ || echo 000)
            if [ "$status" -ge 200 ] && [ "$status" -lt 500 ]; then
              echo "Image is up (HTTP $status)"
              exit 0
            fi
            sleep 1
          done
          echo "Image never became healthy"
          exit 1

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ github.repository }}:${{ steps.version.outputs.value }}
            ${{ github.repository }}:latest
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prepare Docker Hub overview
        run: |
          sed \
            -e 's#src="branding/legendarr-mark-512.png"#src="https://raw.githubusercontent.com/${{ github.repository }}/main/branding/legendarr-mark-512.png"#' \
            -e 's#href="LICENSE"#href="https://github.com/${{ github.repository }}/blob/main/LICENSE"#' \
            -e 's#(docker-compose.example.yml)#(https://github.com/${{ github.repository }}/blob/main/docker-compose.example.yml)#' \
            -e 's#(LICENSE)#(https://github.com/${{ github.repository }}/blob/main/LICENSE)#' \
            README.md > /tmp/dockerhub-readme.md

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ github.repository }}
          short-description: "Self-hosted subtitle translation companion for Radarr and Sonarr"
          readme-filepath: /tmp/dockerhub-readme.md

      - name: Install git-cliff
        uses: taiki-e/install-action@git-cliff

      - name: Generate changelog
        run: |
          git cliff --tag "v${{ steps.version.outputs.value }}" -o docs/changelog.md
          git cliff --tag "v${{ steps.version.outputs.value }}" --latest --strip header -o /tmp/release-notes.md

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml src/backend/pyproject.toml src/web/pyproject.toml src/bootstrap/pyproject.toml uv.lock docs/changelog.md
          git commit -m "chore: bump version to v${{ steps.version.outputs.value }} [skip ci]"
          git push origin HEAD:main

      - name: Determine previous tag
        id: prev_tag
        run: echo "value=$(git tag --list 'v*' --sort=-v:refname | head -n1)" >> "$GITHUB_OUTPUT"

      - name: Tag release
        run: |
          git tag "v${{ steps.version.outputs.value }}"
          git push origin "v${{ steps.version.outputs.value }}"

      - name: Build release notes
        run: |
          cp /tmp/release-notes.md /tmp/release-notes-full.md
          if [ -n "${{ steps.prev_tag.outputs.value }}" ]; then
            printf '\n**Full Changelog**: https://github.com/%s/compare/%s...v%s\n' \
              "${{ github.repository }}" "${{ steps.prev_tag.outputs.value }}" "${{ steps.version.outputs.value }}" \
              >> /tmp/release-notes-full.md
          fi

      - name: Prepare release assets
        run: |
          {
            echo "${{ github.repository }}:${{ steps.version.outputs.value }}"
            echo "${{ github.repository }}:latest"
            echo "digest: ${{ steps.push.outputs.digest }}"
          } > image-digest.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.value }}" \
            --title "v${{ steps.version.outputs.value }}" \
            --notes-file /tmp/release-notes-full.md \
            image-digest.txt \
            docker-compose.example.yml

      - name: Redeploy docs
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run docs.yml
