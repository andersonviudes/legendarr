# git-cliff config — generates docs/changelog.md and each release's notes from
# Conventional Commits (see .claudin/rules/commit-message-convention.md). Commit types match
# the list .github/workflows/pr-title.yml enforces on every PR title.
#
# Usage:
#   git cliff --tag vX.Y.Z -o docs/changelog.md   # full file, regenerated from all tags
#   git cliff --latest --strip header             # just the new tag's section, for the
#                                                  # GitHub release body

[changelog]
header = """
# Changelog

All notable changes to this project are documented here. The format follows
[Keep a Changelog](https://keepachangelog.com/), and commit messages follow
[Conventional Commits](https://www.conventionalcommits.org/).
"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {{ commit.message | upper_first }}\
    {% endfor %}
{% endfor %}\n
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->✨ Features" },
  { message = "^fix", group = "<!-- 1 -->🐛 Bug Fixes" },
  { message = "^docs", group = "<!-- 2 -->📚 Documentation" },
  { message = "^perf", group = "<!-- 3 -->⚡ Performance" },
  { message = "^refactor", group = "<!-- 4 -->♻️ Refactor" },
  { message = "^test", group = "<!-- 5 -->✅ Tests" },
  { message = "^revert", group = "<!-- 6 -->⏪ Reverts" },
  { message = "^(chore|ci|build|style)", group = "<!-- 7 -->🔧 Miscellaneous" },
]
filter_commits = false
tag_pattern = "v[0-9]*"
sort_commits = "oldest"
